{% extends "base.html" %}
{% block title %}Add Package - Cultural Compass{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container text-center">
        <h1><i class="bi bi-plus-circle"></i> Add New Package</h1>
        <p>Create a new travel experience for our adventurers</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card">
                    <div class="card-body p-4">
                        <form action="{{ url_for('add_package') }}" method="POST">
                            <div class="mb-3">
                                <label for="title" class="form-label">Package Title</label>
                                <input type="text" class="form-control" id="title" name="title"
                                       placeholder="e.g. Cherry Blossom Season" required>
                            </div>
                            <div class="mb-3">
                                <label for="destination" class="form-label">Destination</label>
                                <input type="text" class="form-control" id="destination" name="destination"
                                       placeholder="e.g. Tokyo & Kyoto, Japan" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="5"
                                          placeholder="Describe the travel experience..." required></textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="duration" class="form-label">Duration</label>
                                    <input type="text" class="form-control" id="duration" name="duration"
                                           placeholder="e.g. 7 days / 6 nights" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">Price (USD)</label>
                                    <input type="number" step="0.01" class="form-control" id="price" name="price"
                                           placeholder="e.g. 1299.99" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="image_url" class="form-label">Image URL</label>
                                <input type="url" class="form-control" id="image_url" name="image_url"
                                       placeholder="https://example.com/image.jpg" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-accent">
                                    <i class="bi bi-check-circle"></i> Add Package
                                </button>
                                <a href="{{ url_for('packages') }}" class="btn btn-outline-secondary">Cancel</a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
