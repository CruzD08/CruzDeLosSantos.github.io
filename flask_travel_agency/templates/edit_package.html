{% extends "base.html" %}
{% block title %}Edit Package - Cultural Compass{% endblock %}

{% block content %}
<section class="page-header">
    <div class="container text-center">
        <h1><i class="bi bi-pencil-square"></i> Edit Package</h1>
        <p>Update the details for "{{ package.title }}"</p>
    </div>
</section>

<section class="py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card form-card">
                    <div class="card-body p-4">
                        <form action="{{ url_for('edit_package', package_id=package.id) }}" method="POST">
                            <div class="mb-3">
                                <label for="title" class="form-label">Package Title</label>
                                <input type="text" class="form-control" id="title" name="title"
                                       value="{{ package.title }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="destination" class="form-label">Destination</label>
                                <input type="text" class="form-control" id="destination" name="destination"
                                       value="{{ package.destination }}" required>
                            </div>
                            <div class="mb-3">
                                <label for="description" class="form-label">Description</label>
                                <textarea class="form-control" id="description" name="description" rows="5"
                                          required>{{ package.description }}</textarea>
                            </div>
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label for="duration" class="form-label">Duration</label>
                                    <input type="text" class="form-control" id="duration" name="duration"
                                           value="{{ package.duration }}" required>
                                </div>
                                <div class="col-md-6 mb-3">
                                    <label for="price" class="form-label">Price (USD)</label>
                                    <input type="number" step="0.01" class="form-control" id="price" name="price"
                                           value="{{ package.price }}" required>
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="image_url" class="form-label">Image URL</label>
                                <input type="url" class="form-control" id="image_url" name="image_url"
                                       value="{{ package.image_url }}" required>
                            </div>
                            <div class="d-flex gap-2">
                                <button type="submit" class="btn btn-primary">
                                    <i class="bi bi-check-circle"></i> Save Changes
                                </button>
                                <a href="{{ url_for('package_detail', package_id=package.id) }}" class="btn btn-outline-secondary">
                                    Cancel
                                </a>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>
{% endblock %}
